# ─────────────────────────────────────────────────────────────────
#  Gadvede Trekkers — Render Blueprint
#  Two services: backend (Node/Express) + frontend (React/Vite static)
#
#  Deploy via: Render Dashboard → New → Blueprint
#  Repo: https://github.com/vedantvc17/GadvedeTrekkers
# ─────────────────────────────────────────────────────────────────

services:
  # ── 1. Backend — Express API + Admin Panel ─────────────────────
  - type: web
    name: gadvede-backend
    runtime: node
    rootDir: backend
    buildCommand: cd .. && npm install && npm run build:admin && cd backend && npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: ADMIN_USERS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

  # ── 2. Frontend — React/Vite static site (Public Website) ─────
  - type: web
    name: gadvede-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_ADMIN_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    # Response headers (Render ignores public/_headers; static sites take them from here or the Dashboard).
    # HSTS: 1 year, no includeSubDomains/preload on purpose (other gadvede.com subdomains are unverified).
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(self)
    # Rewrites: ONLY the URLs the app answers go to index.html. Anything else is a real 404 (public/404.html).
    # Do not add a blanket /* rewrite. Rules are applied only when no static file exists at the path.
    # BEGIN generated routes (scripts/generate-host-config.mjs, from shared/spaRoutes.js)
    routes:
      - type: redirect
        source: /treks/pawna-lake-camping
        destination: /camping/pawna-lake-camping-2026
      - type: rewrite
        source: /about
        destination: /index.html
      - type: rewrite
        source: /faq
        destination: /index.html
      - type: rewrite
        source: /terms
        destination: /index.html
      - type: rewrite
        source: /contact
        destination: /index.html
      - type: rewrite
        source: /book
        destination: /index.html
      - type: rewrite
        source: /booking/success
        destination: /index.html
      - type: rewrite
        source: /register
        destination: /index.html
      - type: rewrite
        source: /payment-registration
        destination: /index.html
      - type: rewrite
        source: /employee-login
        destination: /index.html
      - type: rewrite
        source: /vendor-register
