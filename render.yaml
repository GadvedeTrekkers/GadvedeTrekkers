# ─────────────────────────────────────────────────────────────────
#  Gadvede Trekkers — Render Blueprint
#  Two services: backend (Node/Express) + frontend (React/Vite static)
#
#  Deploy via: Render Dashboard → New → Blueprint
#  Repo: https://github.com/vedantvc17/GadvedeTrekkers
# ─────────────────────────────────────────────────────────────────

services:
  # ── 1. Backend — Express API ───────────────────────────────────
  - type: web
    name: gadvede-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: ADMIN_USERS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

  # ── 2. Frontend — React/Vite static site ──────────────────────
  - type: web
    name: gadvede-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_ADMIN_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
